[project]
name = "ticket-drop"
version = "0.1.0"
description = "A concert ticket sale app built to be tested: seat holds, payment failure, concurrency, load and security."
requires-python = ">=3.12"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Temporary files go under .local because some managed Windows machines block
# pytest's default folder in AppData (see docs/OPERATIONS.md, troubleshooting).
addopts = "-ra --strict-markers --basetemp=.local/pytest"
filterwarnings = [
    # Starlette's TestClient warns about its httpx dependency; it does not affect results.
    "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
    "e2e: browser tests that drive the real UI with Playwright",
    "concurrency: tests that send parallel requests to a live server",
    "security: authorization, input and abuse tests",
]
