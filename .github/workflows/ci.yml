# Runs the full test suite and the static security scan on GitHub Actions.
# Results of hosted runs are not recorded in this repository.
name: tests

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run the test suite
        # The hosted Windows runner has Google Chrome installed, which the browser tests use.
        run: python -m pytest
      - name: Static security scan
        run: python tools/security_scan.py
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: .local/playwright
