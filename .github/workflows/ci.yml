# Prepared for GitHub Actions. Not yet run on GitHub: the repository has not been published.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run the test suite
        # The hosted Windows runner has Google Chrome installed, which the browser tests use.
        run: python -m pytest
      - name: Static security scan
        run: python tools/security_scan.py
      - name: Keep failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: .local/playwright
